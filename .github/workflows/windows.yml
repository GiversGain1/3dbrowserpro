name: Windows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compilar e empacotar
        shell: pwsh
        run: ./tools/pack.ps1
      - name: Validar identificação dos formatos
        shell: pwsh
        run: ./native/test/sniff-check.ps1
      - name: Validar os pacotes e os conversores
        shell: pwsh
        run: python native/test/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: pacotes-3d-browser-pro
          path: dist/*.zip
          if-no-files-found: error
