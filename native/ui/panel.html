<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Capturas</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="top">
    <img src="../../assets/icon32.png" alt="">
    <div class="titles">
      <strong>3D Browser Pro</strong>
      <span id="sub">nenhum arquivo</span>
    </div>
    <button id="btn-settings" class="icon" title="Configurações">⚙</button>
    <button id="btn-close" class="icon" title="Fechar painel">✕</button>
  </header>

  <div class="bar">
    <input id="search" type="search" placeholder="Buscar nome, site ou formato">
  </div>

  <div class="chips" id="chips"></div>

  <div class="scene" id="scene">Sem cena 3D detectada nesta página.</div>

  <div class="toolbar">
    <button id="btn-glb" class="btn">Exportar .glb</button>
    <button id="btn-obj" class="btn">Exportar .obj</button>
    <button id="btn-scan" class="btn ghost">Escanear</button>
    <button id="btn-open" class="btn ghost" title="Abrir um modelo do disco (Ctrl+O)">Abrir…</button>
    <label class="chk" title="Mostrar o holograma do esqueleto na prévia dos modelos glb/gltf">
      <input id="opt-rig" type="checkbox" checked>
      ver esqueleto
    </label>
  </div>

  <ul class="list" id="list"></ul>
  <p class="empty" id="empty">Nada capturado ainda.<br><span>Dê play no modelo 3D da página.</span></p>

  <footer class="foot">
    <button id="btn-all" class="btn">Baixar tudo</button>
    <button id="btn-clear" class="btn ghost">Limpar</button>
    <button id="btn-folder" class="btn ghost">pasta</button>
  </footer>

  <script src="panel.js"></script>
</body>
</html>
